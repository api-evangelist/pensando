apis:
- name: AMD Pensando Policy and Services Manager (PSM) REST API
  description: >-
    REST API for the AMD Pensando Policy and Services Manager control plane —
    manage clusters, networks, security policy, and services on Pensando DPUs.
    The API is served per-appliance; live interactive docs and the Swagger schema
    are exposed by a running PSM deployment. First-party Python bindings and a
    Terraform provider consume this API.

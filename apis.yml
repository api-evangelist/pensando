aid: pensando
name: Pensando *
description: >-
  AMD Pensando (formerly Pensando Systems, acquired by AMD in 2022) builds
  programmable Distributed Services Cards (DPUs) and the Policy and Services
  Manager (PSM) control plane that operates them across cloud, distributed
  services switch, and enterprise deployments. PSM exposes a REST API — surfaced
  through auto-generated, first-party Python bindings on PyPI (pensando-cloud,
  pensando-dss, pensando-ent) and a Terraform provider — for managing clusters,
  networks, security policy, and services on Pensando infrastructure. Originally
  surfaced as a portfolio company of GV and Lightspeed Venture Partners and added
  to the API Evangelist network for enrichment.
